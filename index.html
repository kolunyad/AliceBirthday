<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<meta name="theme-color" content="#101a35" />
<meta name="description" content="Для моей Алисы. Маленькая сказка ко дню рождения." />
<title>Для моей Алисы — Маленькая сказка ко дню рождения</title>
<style>
:root { color-scheme:dark; --cream:#f4e8d0; --muted:#bdc4da; --gold:#edd39a; --deep:#0b1228; --paper:#fffaf0; }
*{box-sizing:border-box} html,body{margin:0;min-height:100%;font-family:Georgia,'Times New Roman',serif}
body{background:radial-gradient(ellipse at 55% 20%,#273a67 0%,#121d3b 43%,#080e21 100%);color:var(--cream);overflow-x:hidden}
body:before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.42;background-image:radial-gradient(1px 1px at 18% 24%,#fff 98%,transparent),radial-gradient(1px 1px at 82% 13%,#fff 98%,transparent),radial-gradient(2px 2px at 64% 61%,#d6dfff 98%,transparent),radial-gradient(1px 1px at 36% 82%,#fff 98%,transparent),radial-gradient(1px 1px at 91% 85%,#fff 98%,transparent);background-size:220px 210px,340px 300px,470px 410px,390px 350px,510px 480px;animation:twinkle 14s ease-in-out infinite alternate}
@keyframes twinkle{to{opacity:.19}}
.shell{position:relative;z-index:1;min-height:100svh;display:flex;flex-direction:column;align-items:center;padding:17px 16px 22px;gap:11px}
header{text-align:center;flex:none} .overline{font:11px/1.5 system-ui,sans-serif;letter-spacing:.29em;text-transform:uppercase;color:var(--gold)}
h1{font-size:clamp(18px,2.9vw,28px);font-weight:normal;letter-spacing:.03em;margin:5px 0 0} .lead{font:12px/1.5 system-ui,sans-serif;color:var(--muted);margin:5px 0 0}
.stage{position:relative;flex:1;min-height:0;width:100%;display:flex;align-items:center;justify-content:center;perspective:1800px;user-select:none}
.book{position:relative;aspect-ratio: 2 / 2.83;height:min(72svh,810px);max-width:calc(100vw - 80px);filter:drop-shadow(0 26px 32px rgba(0,0,0,.45));transform-style:preserve-3d}
.book:before{content:"";position:absolute;inset:4px -8px -4px 5px;background:linear-gradient(to right,#a99b87,#fff5d9 23%,#f9efd9 83%,#b5a489);border-radius:4px 13px 13px 4px;box-shadow:7px 3px 0 #9b8b77,9px 6px 10px #0007;transform:translateZ(-5px)}
.sheet{position:absolute;inset:0;transform-origin:0% 50%;transform-style:preserve-3d;border-radius:3px 8px 8px 3px;will-change:transform;cursor:zoom-in;overflow:hidden;background:#f3eada;box-shadow:inset 7px 0 13px #0002,0 1px 4px #0006;backface-visibility:hidden}
.sheet img{display:block;width:100%;height:100%;object-fit:contain;background:#f2e8db;pointer-events:none}
.sheet:after{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(90deg,rgba(0,0,0,.16),transparent 9%,transparent 88%,rgba(0,0,0,.06));mix-blend-mode:multiply}
.sheet.flip-next{animation:turnNext 850ms cubic-bezier(.42,.05,.18,.98) both}
.sheet.flip-prev{animation:turnPrev 850ms cubic-bezier(.42,.05,.18,.98) both}
@keyframes turnNext{0%{transform:rotateY(0);filter:brightness(1)}48%{transform:rotateY(-87deg);filter:brightness(.67)}52%{transform:rotateY(-87deg);filter:brightness(.67)}100%{transform:rotateY(0);filter:brightness(1)}}
@keyframes turnPrev{0%{transform:rotateY(0)}48%{transform:rotateY(87deg);filter:brightness(.7)}52%{transform:rotateY(87deg);filter:brightness(.7)}100%{transform:rotateY(0)}}
.controls{width:min(680px,100%);display:flex;align-items:center;justify-content:center;gap:12px;flex-wrap:wrap}
button{font:14px/1.2 system-ui,sans-serif;background:#17274d;border:1px solid #a9b9dc66;color:#f4ebdc;border-radius:999px;padding:11px 17px;cursor:pointer;transition:background .2s,transform .2s}
button:hover{background:#29416f}button:active{transform:scale(.97)}button:disabled{opacity:.3;cursor:default}
button.primary{background:linear-gradient(135deg,#e4cb96,#bfa064);color:#1a2232;border:0;font-weight:600}.count{font:13px system-ui,sans-serif;color:#d7c8ad;min-width:86px;text-align:center;font-variant-numeric:tabular-nums}
.secondary{display:flex;align-items:center;justify-content:center;gap:11px;flex-wrap:wrap} .secondary button{background:transparent;font-size:12px;padding:6px 11px;color:var(--muted);border-color:#ffffff25}
footer{text-align:center;color:#9eacca;font:11px/1.5 system-ui,sans-serif}
.endcard{position:fixed;inset:0;z-index:5;background:#060d22dd;display:none;align-items:center;justify-content:center;padding:20px;backdrop-filter:blur(10px)}.endcard.open{display:flex}
.endpanel{text-align:center;width:min(500px,100%);padding:40px 25px 34px;border:1px solid #cbb68277;border-radius:16px;background:radial-gradient(circle at top,#24365b,#101a35 75%);box-shadow:0 25px 100px #0009}
.sigil{color:#f5dc9e;letter-spacing:.5em;font-size:22px}.endpanel h2{font-weight:normal;font-size:clamp(25px,5vw,37px);margin:20px 0 15px}.endpanel p{font-size:19px;line-height:1.6}.signature{font-style:italic;color:var(--gold);margin:18px 0 28px}
.zoom{position:fixed;inset:0;z-index:10;background:rgba(3,7,17,.96);display:none;align-items:center;justify-content:center;padding:10px}.zoom.open{display:flex}.zoom img{max-height:95svh;max-width:96vw;object-fit:contain}.zoom button{position:absolute;top:12px;right:12px;background:#273758}
@media(max-width:600px){.shell{padding:12px 8px 16px;gap:8px}.stage{min-height:0}.book{height:min(70svh,710px);max-width:calc(100vw - 34px)}h1{font-size:19px}.lead{font-size:11px}.controls{gap:6px}.controls button{padding:10px 12px}.overline{font-size:9px}.count{min-width:65px;font-size:12px}footer{font-size:10px}}
@media(prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style>
</head>
<body>
<main class="shell">
<header><div class="overline">Одна маленькая история • Только для тебя</div><h1>Для моей Алисы</h1><p class="lead">Маленькая сказка ко дню рождения</p></header>
<div class="stage" id="stage" aria-label="Иллюстрированная книга">
 <div class="book" id="book"><div class="sheet" id="sheet" tabindex="0" title="Нажмите, чтобы увеличить изображение"><img id="pageImage" src="images/01.webp" alt="Обложка книги Для моей Алисы" draggable="false"></div></div>
</div>
<div class="controls"><button id="prev" aria-label="Предыдущая страница">← Назад</button><span class="count" id="count">Обложка · 1/15</span><button id="next" class="primary" aria-label="Следующая страница">Открыть книгу →</button></div>
<div class="secondary"><button id="auto" aria-pressed="false">▶ Автолистание</button><button id="zoomBtn">⛶ На весь экран</button><button id="restart">↺ Сначала</button></div>
<footer>Листай стрелками или свайпом · Нажми на страницу, чтобы рассмотреть её</footer>
</main>
<section class="endcard" id="endcard" role="dialog" aria-label="Поздравление" aria-modal="true"><div class="endpanel"><div class="sigil">☼ · ✧ · ♡</div><h2>С днём рождения, моё Солнышко!</h2><p>Ты самый светлый человек в этом мире.</p><div class="signature">Твой Зая Коля.</div><button class="primary" id="closeEnd">Вернуться к книжке</button></div></section>
<section class="zoom" id="zoom" role="dialog" aria-label="Просмотр иллюстрации" aria-modal="true"><button id="closeZoom">✕ Закрыть</button><img id="zoomImage" alt="Страница книги в увеличенном виде"></section>
<script>
(()=>{
'use strict';
const total=15, pageImage=document.getElementById('pageImage'),sheet=document.getElementById('sheet'),count=document.getElementById('count'),prev=document.getElementById('prev'),next=document.getElementById('next'),auto=document.getElementById('auto'),zoom=document.getElementById('zoom'),zoomImage=document.getElementById('zoomImage'),endcard=document.getElementById('endcard');
const titles=['Обложка','Утро, в которое открываются чудеса','Письмо от Заи','Маленькая дверь в сад','Сад пионов','Лилии у тихой воды','Комната забытых забот','Чаепитие только для неё','Галерея живых картин','Город тёплого ветра','Лунный сад тишины','Поляна приключений','Зеркало будущих чудес','Дорога тысячи огоньков','Самое главное чудо'];
const source=n=>'images/'+String(n).padStart(2,'0')+'.webp';
let page=1,busy=false,playing=false,timer=null;
for(let n=1;n<=total;n++){let img=new Image();img.src=source(n)}
function render(){pageImage.src=source(page);pageImage.alt=`Страница ${page}: ${titles[page-1]}`;count.textContent=page===1?`Обложка · 1/${total}`:`${page} / ${total}`;prev.disabled=page===1;next.textContent=page===1?'Открыть книгу →':page===total?'Завершить ♡':'Дальше →';}
function turn(direction){if(busy||zoom.classList.contains('open')||endcard.classList.contains('open'))return;if(direction===1&&page===total){stopAuto();endcard.classList.add('open');return}const n=page+direction;if(n<1||n>total)return;busy=true;sheet.classList.remove('flip-next','flip-prev');void sheet.offsetWidth;sheet.classList.add(direction>0?'flip-next':'flip-prev');setTimeout(()=>{page=n;render()},420);setTimeout(()=>{sheet.classList.remove('flip-next','flip-prev');busy=false;},870)}
function stopAuto(){playing=false;clearInterval(timer);timer=null;auto.textContent='▶ Автолистание';auto.setAttribute('aria-pressed','false')}
function toggleAuto(){if(playing){stopAuto();return}playing=true;auto.textContent='Ⅱ Пауза';auto.setAttribute('aria-pressed','true');timer=setInterval(()=>{if(page===total){stopAuto();endcard.classList.add('open')}else turn(1)},8500)}
function showZoom(){stopAuto();zoomImage.src=source(page);zoom.classList.add('open')}
function closeZoom(){zoom.classList.remove('open')}
prev.onclick=()=>turn(-1);next.onclick=()=>turn(1);auto.onclick=toggleAuto;document.getElementById('zoomBtn').onclick=showZoom;sheet.onclick=showZoom;document.getElementById('closeZoom').onclick=closeZoom;zoom.onclick=e=>{if(e.target===zoom)closeZoom()};document.getElementById('restart').onclick=()=>{stopAuto();endcard.classList.remove('open');page=1;render()};document.getElementById('closeEnd').onclick=()=>endcard.classList.remove('open');
document.addEventListener('keydown',e=>{if(e.key==='Escape'){closeZoom();endcard.classList.remove('open')}else if(!zoom.classList.contains('open')&&!endcard.classList.contains('open')){if(e.key==='ArrowRight'){turn(1)}else if(e.key==='ArrowLeft'){turn(-1)}}});
let startX=0;const stage=document.getElementById('stage');stage.addEventListener('touchstart',e=>{startX=e.changedTouches[0].screenX},{passive:true});stage.addEventListener('touchend',e=>{const dx=e.changedTouches[0].screenX-startX;if(Math.abs(dx)>45)turn(dx<0?1:-1)},{passive:true});
render();
})();
</script>
</body></html>
